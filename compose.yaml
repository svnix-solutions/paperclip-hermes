services:
  paperclip-hermes:
    image: ghcr.io/svnix-solutions/paperclip-hermes:${IMAGE_TAG:-latest}
    container_name: paperclip-hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      DATABASE_URL: "postgres://paperclip:${PG_PASSWORD}@postgres:5432/paperclip"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      PAPERCLIP_AGENT_JWT_SECRET: "${PAPERCLIP_AGENT_JWT_SECRET}"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: paperclip
    volumes:
      - paperclip-hermes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      retries: 10

volumes:
  paperclip-data:
  paperclip-hermes-pgdata: